[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "dopamine-rl"
version = "4.1.2"
description = "Dopamine: A framework for flexible Reinforcement Learning research"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "The Dopamine Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education", 
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["dopamine", "reinforcement", "machine", "learning", "research"]
requires-python = ">=3.7"
dependencies = [
    "jax >= 0.4.33",
    "jaxlib >= 0.4.33", 
    "flax >= 0.5.3",
    "optax >= 0.1.5",
    "gin-config >= 0.3.0",
    "numpy >= 2.2.0",
    "orbax-checkpoint >= 0.6.0",
    "absl-py >= 0.9.0",
    "python-snappy >= 0.7.3",
    "etils[epath] >= 1.0.0",
    "msgpack >= 1.0.0",
    "pyyaml >= 6.0",
]

[project.urls]
Homepage = "https://github.com/google/dopamine"
Documentation = "https://github.com/google/dopamine"
Repository = "https://github.com/google/dopamine"
"Bug Reports" = "https://github.com/google/dopamine/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["docs*"]

[tool.setuptools.package-data]
testdata = ["testdata/*.gin"]